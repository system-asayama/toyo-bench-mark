{% extends "admin/base.html" %}
{% block title %}パスワード変更{% endblock %}
{% block content %}
<div class="panel panel--narrow">
  <h1>パスワード変更</h1>
  {% if error %}<div class="alert alert--error">{{ error }}</div>{% endif %}
  <form method="post" action="/admin/password" class="form">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <div class="form-row"><label for="current">現在のパスワード</label><input id="current" name="current" type="password" autocomplete="current-password" required></div>
    <div class="form-row"><label for="password">新しいパスワード（8文字以上）</label><input id="password" name="password" type="password" autocomplete="new-password" required minlength="8"></div>
    <div class="form-row"><label for="password2">新しいパスワード（確認）</label><input id="password2" name="password2" type="password" autocomplete="new-password" required minlength="8"></div>
    <button class="btn btn--primary" type="submit">変更する</button>
  </form>
</div>
{% endblock %}
