services:
  web:
    build: .
    ports:
      - "${WEB_PORT:-8080}:8000"
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/toyo_bench_mark
    depends_on:
      - db
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: toyo_bench_mark
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped
volumes:
  db_data:
