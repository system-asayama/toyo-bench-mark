services:
  web:
    build: .
    ports:
      - "${WEB_PORT:-8080}:8000"
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/toyo_bench_mark
      # ログイン状態を再起動後も保つための鍵（サーバーの .env に SECRET_KEY=ランダム文字列 を書く）
      SECRET_KEY: ${SECRET_KEY:-}
      # 任意：ADMIN_PASSWORD を設定すると、その管理者（ユーザー名 ADMIN_USER）を自動作成
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      - db
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: toyo_bench_mark
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped
volumes:
  db_data:
